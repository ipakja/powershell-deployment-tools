<!doctype html>
<html lang="$html_lang">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$about_title | BIT</title>
    <meta name="description" content="$about_lead">
    <link rel="canonical" href="$canonical">
$alternate_links
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/assets/universal.css?v=9">
    <script type="application/ld+json">$structured_data</script>
</head>
<body data-current-language="$language">
    <a class="skip-link" href="#main">$skip</a>
    <header class="site-header"><div class="container header-inner">
        <a class="brand" href="/$language/" aria-label="BIT"><img src="/LOGO_DARK.png" alt="BIT – Boks IT Support" width="174"></a>
        <nav class="language-nav" data-language-nav aria-label="$languages_label">$language_links</nav>
    </div></header>
    <main id="main"><section class="section"><div class="container about-layout">
        <img class="about-photo" src="/ICH.png" alt="$image_alt" width="430">
        <div class="about-copy"><p class="eyebrow">$about_title</p><h1>$about_lead</h1><p>$about_text</p><p>$about_independent</p>
        <a class="button button-secondary" href="/$language/">$back</a></div>
    </div></section></main>
    <footer class="site-footer"><div class="container footer-inner"><div>© 2026 BIT · $location</div>
        <div class="footer-links"><a href="/$language/legal/">$legal_label</a></div></div></footer>
    <script type="module" src="/assets/js/app.js?v=2"></script>
</body>
</html>
